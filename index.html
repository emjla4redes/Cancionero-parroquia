<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cancionero Parroquia de la Asunción</title>
  <style>
    :root {
      --bg-color: #1a1512;        /* Fondo oscuro cálido */
      --card-bg: #2c221e;        /* Tarjetas en tono marrón oscuro */
      --accent-color: #e67e22;      /* Naranja cálido */
      --text-color: #ffffff;
      --text-secondary: #bdc3c7;
      --refrain-color: #f1c40f;    /* Amarillo/dorado para el estribillo */
      --chord-color: #5adeff;      /* Azul claro para los acordes */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px solid var(--accent-color);
    }

    h1 {
      font-size: 1.1rem;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-grow: 1;
    }

    .btn-back {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: none;
      white-space: nowrap;
    }

    main {
      padding: 20px;
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    /* MARCO DE LA PORTADA CON SOBREPOSICIÓN */
    .home-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* FILTRO DE OSCURECIMIENTO Y CAPA DE BOTONES */
    .grid-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Coloca los botones en la parte inferior para lucir el arte superior */
      gap: 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0.2) 100%);
    }

    .btn-main {
      background-color: rgba(44, 34, 30, 0.88); /* Fondo semi-transparente que deja ver la portada */
      color: var(--text-color);
      border: 2px solid var(--accent-color);
      padding: 18px 15px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px); /* Efecto cristal traslúcido */
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
      background-color: rgba(230, 126, 34, 0.9);
    }

    .grid-abc {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 12px;
    }

    .btn-letter {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      padding: 18px 0;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .list-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-song, .item-topic {
      background-color: var(--card-bg);
      padding: 18px 20px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .song-number {
      font-weight: bold;
      color: var(--accent-color);
      margin-right: 15px;
      font-size: 1.3rem;
    }

   .lyrics-container {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      font-size: 1.35rem;
      line-height: 2.2;
      color: #f1f2f6;
    }

  /* SISTEMA DE LIBRO AUTO-FLUIDO EN TABLET (LÍNEAS DE DIVISIÓN PROTEGIDAS) */
    @media (min-width: 600px) {
      main {
        max-width: 100%;
        padding: 10px 20px;
      }

      .lyrics-container {
        box-sizing: border-box;
        height: 78vh;
        width: 100%;
        padding: 25px 35px;
        
        /* FLUJO HORIZONTAL TIPO LIBRO */
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        
        column-fill: auto;
        column-gap: 50px; /* Aumenta el espacio seguro entre columna y línea divisoria */
        column-rule: 1px solid rgba(230, 126, 34, 0.35);
      }

     /* TABLET / MONITOR VERTICAL (2 columnas exactas) */
      @media (orientation: portrait) {
        .lyrics-container {
          column-count: 2;
          column-gap: 40px;
        }
      }

      /* TABLET / MONITOR HORIZONTAL 16:9 y 4:3 (3 columnas exactas) */
      @media (orientation: landscape) {
        .lyrics-container {
          column-count: 3;
          column-gap: 40px;
        }
      }

      .verse, .estribillo {
        break-inside: auto; /* Permite cortar la estrofa si se acaba la columna */
        page-break-inside: auto;
        margin-bottom: 22px;
        word-break: break-word; 
        overflow-wrap: break-word;
      }
    }

    .verse {
      margin-bottom: 25px;
      font-weight: normal;
      color: #f1f2f6;
      white-space: pre-wrap;
    }

    .estribillo {
      margin-bottom: 25px;
      font-weight: bold !important;
      color: var(--refrain-color) !important;
      white-space: pre-wrap;
    }

    ruby {
      ruby-position: over;
    }

    rt {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--chord-color);
      line-height: 1;
    }

    .lyrics-title {
      font-size: 1.6rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }
 /* CONTENEDOR DE BOTONES (PESTAÑAS) */
    .toggle-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    /* CONTROLES DE TRANSPOSICIÓN */
    .transpose-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 15px;
      background-color: var(--card-bg);
      padding: 8px 15px;
      border-radius: 8px;
      border: 1px solid rgba(230, 126, 34, 0.3);
    }

    .transpose-label {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-secondary);
      margin-right: auto;
    }

    .btn-transpose {
      background-color: var(--accent-color);
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 6px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-transpose:active {
      transform: scale(0.92);
    }

    /* VISTA DE LA IMAGEN DE PARTITURA */
    .sheet-container {
      width: 100%;
      text-align: center;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
    }

    .sheet-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
/* SELECTOR DE VOCES / INSTRUMENTOS */
    .voice-selector-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .voice-btn {
      padding: 8px 14px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .voice-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
    } 
/* Aplica esto a la clase o elemento que contiene los versos */
    .verso, .letra, pre {
      white-space: pre-wrap;       /* Mantiene los saltos de línea pero ajusta al ancho disponible */
      overflow-wrap: break-word;   /* Rompe las palabras solo si son más largas que la pantalla */
      word-wrap: break-word;       /* Compatibilidad con navegadores antiguos */
}
</style>
</head>

  <header>
    <button id="btn-back" class="btn-back" onclick="goBack()">← Volver</button>
    <h1 id="header-title">CANCIONERO PARROQUIA DE LA ASUNCIÓN LA RAMBLA</h1>
  </header>

  <main>

    <div id="view-home" class="home-container">

      <div class="grid-menu">
        <button class="btn-main" onclick="showAlphabet()">ÍNDICE ALFABÉTICO</button>
        <button class="btn-main" onclick="showNumeric()">ÍNDICE NUMÉRICO</button>
        <button class="btn-main" onclick="showTopics()">ÍNDICE TEMÁTICO</button>
      </div>
    </div>

    <!-- VISTA ALFABÉTICA (LETRAS) -->
    <div id="view-alphabet" class="grid-abc hidden"></div>

    <!-- VISTA LISTADO TEMÁTICO -->
    <div id="view-topics" class="list-group hidden"></div>

    <!-- VISTA LISTADO DE CANCIONES -->
    <div id="view-songs-list" class="list-group hidden"></div>

   <!-- VISTA DETALLE DE CANCIÓN (LETRA / PARTITURA) -->
    <div id="view-lyrics" class="hidden">
      <!-- BOTONES PRINCIPALES (LETRA / PARTITURA) -->
      <div class="toggle-container">
        <button id="btn-tab-lyrics" class="tab-btn active" onclick="switchSongView('lyrics')">📄 Letra y Acordes</button>
        <button id="btn-tab-sheet" class="tab-btn" onclick="switchSongView('sheet')">🎼 Partitura</button>
      </div>

      <!-- BOTONES DE TRANSPOSICIÓN -->
      <div id="transpose-controls" class="transpose-bar">
        <span class="transpose-label">Tono / Acordes:</span>
        <button class="btn-transpose" onclick="transposeSong(-1)">-</button>
        <button class="btn-transpose" onclick="transposeSong(1)">+</button>
      </div>

      <h2 id="song-title" class="lyrics-title"></h2>

      <!-- VISTA DE TEXTO CON ACORDES -->
      <div id="song-body" class="lyrics-container"></div>

      <!-- VISTA DE PARTITURA -->
      <div id="song-sheet-container" class="sheet-container hidden">
        <!-- BOTONES DE SELECCIÓN DE VOZ/INSTRUMENTO -->
        <div id="voice-selector" class="voice-selector-container"></div>

        <!-- IMAGEN DE LA PARTITURA SELECCIONADA -->
        <img id="song-sheet-img" src="" alt="Partitura" class="sheet-image">
      </div>
    </div>
  </main>

    let currentHistory = ['home'];
    let currentSong = null;
    let currentTransposeOffset = 0;

    // LÓGICA DE TRANSPOSICIÓN DE ACORDES
    const chromaticScale = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];

    function transposeChordName(chord, semitones) {
      // Expresión regular para separar la nota base/bajo del resto de la estructura
      return chord.replace(/([A-Z][a-zñáéíóú]*[#b]?)/g, (match) => {
        let note = match;
        // Normalizaciones comunes
        if (note === "Do") return getTransposedNote("Do", semitones);
        if (note === "Re") return getTransposedNote("Re", semitones);
        if (note === "Mi") return getTransposedNote("Mi", semitones);
        if (note === "Fa") return getTransposedNote("Fa", semitones);
        if (note === "Sol") return getTransposedNote("Sol", semitones);
        if (note === "La") return getTransposedNote("La", semitones);
        if (note === "Si") return getTransposedNote("Si", semitones);
        if (note === "Sib") return getTransposedNote("La#", semitones);
        if (note === "Mib") return getTransposedNote("Re#", semitones);
        if (note === "Lab") return getTransposedNote("Sol#", semitones);
        if (note === "Reb") return getTransposedNote("Do#", semitones);
        if (note === "Solb") return getTransposedNote("Fa#", semitones);
        
        // Manejo minúsculas
        let lower = note.toLowerCase();
        if (lower === "do") return getTransposedNote("Do", semitones);
        if (lower === "re") return getTransposedNote("Re", semitones);
        if (lower === "mi") return getTransposedNote("Mi", semitones);
        if (lower === "fa") return getTransposedNote("Fa", semitones);
        if (lower === "sol") return getTransposedNote("Sol", semitones);
        if (lower === "la") return getTransposedNote("La", semitones);
        if (lower === "si") return getTransposedNote("Si", semitones);
        if (lower === "mim") return getTransposedNote("Mi", semitones);
        if (lower === "lam") return getTransposedNote("La", semitones);
        if (lower === "rem") return getTransposedNote("Re", semitones);
        if (lower === "sim") return getTransposedNote("Si", semitones);
        if (lower === "fa#m") return getTransposedNote("Fa#", semitones);
        if (lower === "do#m") return getTransposedNote("Do#", semitones);
        if (lower === "sol#m") return getTransposedNote("Sol#", semitones);

        return match;
      });
    }

    function getTransposedNote(noteName, semitones) {
      let index = chromaticScale.indexOf(noteName);
      if (index === -1) return noteName;
      let newIndex = (index + semitones) % 12;
      if (newIndex < 0) newIndex += 12;
      return chromaticScale[newIndex];
    }

    function transposeLyrics(lyricsText, semitones) {
      if (semitones === 0) return lyricsText;
      
      // Procesa todo lo que se encuentra dentro de corchetes [Acorde]
      return lyricsText.replace(/\[(.*?)\]/g, (match, chordContent) => {
        // Soporta acordes compuestos separados por guiones o barras
        let transposedContent = chordContent.replace(/([A-Z][a-zñ#°0-9\/]*|mi|lam|rem|sim|fa#m|do#m|sol#m)/g, (m) => {
          // Si incluye barra (ej. Re/Fa#)
          if (m.includes('/')) {
            let parts = m.split('/');
            return transposeSingleChord(parts[0], semitones) + '/' + transposeSingleChord(parts[1], semitones);
          }
          return transposeSingleChord(m, semitones);
        });
        return `[${transposedContent}]`;
      });
    }

    function transposeSingleChord(chord, semitones) {
      // Extrae la nota raíz
      let match = chord.match(/^(Do#|Re#|Fa#|Sol#|La#|Do|Re|Mi|Fa|Sol|La|Si|do|re|mi|fa|sol|la|si|Sib|Mib|Lab|Reb|Solb)/);
      if (!match) return chord;

      let root = match[0];
      let rest = chord.slice(root.length);
      
      // Normalización de minúsculas
      let rootCap = root.charAt(0).toUpperCase() + root.slice(1).toLowerCase();
      if (rootCap === "Sib") rootCap = "La#";
      if (rootCap === "Mib") rootCap = "Re#";
      if (rootCap === "Lab") rootCap = "Sol#";
      if (rootCap === "Reb") rootCap = "Do#";
      if (rootCap === "Solb") rootCap = "Fa#";

      let index = chromaticScale.indexOf(rootCap);
      if (index === -1) return chord;

      let newIndex = (index + semitones) % 12;
      if (newIndex < 0) newIndex += 12;

      return chromaticScale[newIndex] + rest;
    }

    function transposeSong(semitones) {
      if (!currentSong) return;
      currentTransposeOffset += semitones;
      renderSongLyrics();
    }

    function renderSongLyrics() {
      if (!currentSong) return;
      let lyricsToRender = transposeLyrics(currentSong.lyrics, currentTransposeOffset);
      
      let html = '';
      let blocks = lyricsToRender.split('\n\n');
      
      blocks.forEach(block => {
        let isRefrain = block.startsWith('*') || block.includes('ESTRIBILLO:');
        let cleanBlock = block.replace(/^\*/, '').replace(/\*$/, '');
        let className = isRefrain ? 'estribillo' : 'verse';
        
        let processedText = cleanBlock.replace(/\[(.*?)\]([^\n\[]*)/g, (match, chord, text) => {
          if (text === '') text = ' ';
          return `<ruby>${text}<rt>${chord}</rt></ruby>`;
        });
        
        html += `<div class="${className}">${processedText}</div>`;
      });

      document.getElementById('song-body').innerHTML = html;
    }

    // NAVEGACIÓN Y VISTAS
    function showView(viewId) {
      const views = ['view-home', 'view-alphabet', 'view-topics', 'view-songs-list', 'view-lyrics'];
      views.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');

      const btnBack = document.getElementById('btn-back');
      if (viewId === 'view-home') {
        btnBack.style.display = 'none';
        document.getElementById('header-title').innerText = "CANCIONERO PARROQUIA DE LA ASUNCIÓN LA RAMBLA";
      } else {
        btnBack.style.display = 'block';
      }
    }

    function navigateTo(viewId) {
      currentHistory.push(viewId);
      showView(viewId);
    }

    function goBack() {
      if (currentHistory.length > 1) {
        currentHistory.pop();
        const previousView = currentHistory[currentHistory.length - 1];
        showView(previousView);
      }
    }

    function showAlphabet() {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const grid = document.getElementById('view-alphabet');
      grid.innerHTML = "";

      alphabet.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = "btn-letter";
        btn.innerText = letter;
        btn.onclick = () => showSongsByLetter(letter);
        grid.appendChild(btn);
      });

      document.getElementById('header-title').innerText = "ÍNDICE ALFABÉTICO";
      navigateTo('view-alphabet');
    }

    function showSongsByLetter(letter) {
      const filtered = songs.filter(s => s.title.toUpperCase().startsWith(letter));
      renderSongsList(filtered, `Letra: ${letter}`);
    }

    function showNumeric() {
      const sorted = [...songs].sort((a, b) => a.id - b.id);
      renderSongsList(sorted, "TODAS LAS CANCIONES");
    }

    function showTopics() {
      const topicsSet = new Set();
      songs.forEach(s => {
        if (Array.isArray(s.topic)) {
          s.topic.forEach(t => topicsSet.add(t));
        } else if (s.topic) {
          topicsSet.add(s.topic);
        }
      });

      const list = document.getElementById('view-topics');
      list.innerHTML = "";

      Array.from(topicsSet).sort().forEach(topic => {
        const item = document.createElement('div');
        item.className = "item-topic";
        item.innerText = topic;
        item.onclick = () => showSongsByTopic(topic);
        list.appendChild(item);
      });

      document.getElementById('header-title').innerText = "ÍNDICE TEMÁTICO";
      navigateTo('view-topics');
    }

    function showSongsByTopic(topic) {
      const filtered = songs.filter(s => {
        if (Array.isArray(s.topic)) {
          return s.topic.includes(topic);
        }
        return s.topic === topic;
      });
      renderSongsList(filtered, topic);
    }

    function renderSongsList(songList, title) {
      const listContainer = document.getElementById('view-songs-list');
      listContainer.innerHTML = "";

      if (songList.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center; padding: 20px;'>No hay canciones registradas en esta sección.</p>";
      } else {
        songList.forEach(song => {
          const item = document.createElement('div');
          item.className = "item-song";
          item.innerHTML = `<span class="song-number">${song.id}.</span> <span>${song.title}</span>`;
          item.onclick = () => showLyrics(song.id);
          listContainer.appendChild(item);
        });
      }

      document.getElementById('header-title').innerText = title;
      navigateTo('view-songs-list');
    }

    function showLyrics(songId) {
      const song = songs.find(s => s.id === songId);
      if (!song) return;

      currentSong = song;
      currentTransposeOffset = 0; // Resetea el tono al abrir la canción

      document.getElementById('song-title').innerText = `${song.id}. ${song.title}`;
      
      // Renderizar letra con acordes
      renderSongLyrics();

      // Configurar las pestañas (Letra / Partitura)
      const tabSheet = document.getElementById('btn-tab-sheet');
      const voiceSelector = document.getElementById('voice-selector');
      const transposeControls = document.getElementById('transpose-controls');

      if (song.sheet && song.sheet.length > 0) {
        tabSheet.style.display = 'block';
        voiceSelector.innerHTML = '';
        
        song.sheet.forEach((sh, index) => {
          const btn = document.createElement('button');
          btn.className = `voice-btn ${index === 0 ? 'active' : ''}`;
          btn.innerText = sh.name;
          btn.onclick = () => switchVoice(sh.url, btn);
          voiceSelector.appendChild(btn);
        });

        document.getElementById('song-sheet-img').src = song.sheet[0].url;
      } else {
        tabSheet.style.display = 'none';
      }

      switchSongView('lyrics');
      document.getElementById('header-title').innerText = song.title;
      navigateTo('view-lyrics');
    }

    function switchSongView(view) {
      const lyricsBtn = document.getElementById('btn-tab-lyrics');
      const sheetBtn = document.getElementById('btn-tab-sheet');
      const body = document.getElementById('song-body');
      const sheetContainer = document.getElementById('song-sheet-container');
      const transposeControls = document.getElementById('transpose-controls');

      if (view === 'lyrics') {
        lyricsBtn.classList.add('active');
        sheetBtn.classList.remove('active');
        body.classList.remove('hidden');
        transposeControls.classList.remove('hidden');
        sheetContainer.classList.add('hidden');
      } else {
        sheetBtn.classList.add('active');
        lyricsBtn.classList.remove('active');
        body.classList.add('hidden');
        transposeControls.classList.add('hidden');
        sheetContainer.classList.remove('hidden');
      }
    }

    function switchVoice(url, btnElement) {
      document.getElementById('song-sheet-img').src = url;
      const buttons = document.querySelectorAll('.voice-btn');
      buttons.forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>
