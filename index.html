<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cancionero Parroquia de la Asunción</title>
  <style>
    :root {
      --bg-color: #1a252f;
      --card-bg: #2c3e50;
      --accent-color: #3498db;
      --text-color: #ffffff;
      --text-secondary: #bdc3c7;
      --refrain-color: #ffffff; /* Color para el estribillo (puedes cambiarlo) */
      --chord-color: #5adeff;   /* Color para los acordes (azul turquesa claro) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 {
      font-size: 1.1rem;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-grow: 1;
    }

    .btn-back {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: none;
      white-space: nowrap;
    }

    main {
      padding: 20px;
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .btn-main {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--accent-color);
      padding: 22px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .grid-abc {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 12px;
    }

    .btn-letter {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      padding: 18px 0;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .list-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-song, .item-topic {
      background-color: var(--card-bg);
      padding: 18px 20px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .song-number {
      font-weight: bold;
      color: var(--accent-color);
      margin-right: 15px;
      font-size: 1.3rem;
    }

    .lyrics-container {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      font-size: 1.35rem;
      line-height: 2.2; /* Mayor espacio vertical para acomodar los acordes superiores */
      color: #f1f2f6;
    }

    /* Estrofa normal */
    .verse {
      margin-bottom: 25px;
      font-weight: normal;
      color: #f1f2f6;
      white-space: pre-wrap;
    }

    /* Estribillo completo en NEGRITA */
    .estribillo {
      margin-bottom: 25px;
      font-weight: bold !important;
      color: var(--refrain-color) !important;
      white-space: pre-wrap;
    }

    /* Estilo de los ACORDES sobre el texto */
    ruby {
      ruby-position: over;
    }

    rt {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--chord-color);
      line-height: 1;
    }

    .lyrics-title {
      font-size: 1.6rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <button id="btn-back" class="btn-back" onclick="goBack()">← Volver</button>
    <h1 id="header-title">CANCIONERO PARROQUIA DE LA ASUNCIÓN LA RAMBLA</h1>
  </header>

  <main>
    <!-- PANTALLA PRINCIPAL (NIVEL 1) -->
    <div id="view-home" class="grid-menu">
      <button class="btn-main" onclick="showAlphabet()">ÍNDICE ALFABÉTICO</button>
      <button class="btn-main" onclick="showNumeric()">ÍNDICE NUMÉRICO</button>
      <button class="btn-main" onclick="showTopics()">ÍNDICE TEMÁTICO</button>
    </div>

    <!-- VISTA ALFABÉTICA (LETRAS) -->
    <div id="view-alphabet" class="grid-abc hidden"></div>

    <!-- VISTA LISTADO TEMÁTICO -->
    <div id="view-topics" class="list-group hidden"></div>

    <!-- VISTA LISTADO DE CANCIONES -->
    <div id="view-songs-list" class="list-group hidden"></div>

    <!-- VISTA LETRA DE CANCIÓN -->
    <div id="view-lyrics" class="hidden">
      <h2 id="song-title" class="lyrics-title"></h2>
      <div id="song-body" class="lyrics-container"></div>
    </div>
  </main>

  <script>
    // EJEMPLO DE USO DE ACORDES:
    // Escribe el acorde dentro de corchetes [Do] antes de la palabra o sílaba:
    // Ejemplo: [Do]Ala[Sol]baré, [Do]ala[Fa]baré...
    const songs = [
      { 
        id: 1, 
        title: "Alabaré a mi Señor", 
        topic: "ENTRADA", 
        lyrics: "ESTRIBILLO:\n[Do]Alaba[Lam]ré, alaba[Rem]ré,\n[Sol7]alabaré a mi Se[Do]ñor.\n\n[Do]Juan vio el número de los redi[Lam]midos\ny todos ala[Rem]baban [Sol7]al Se[Do]ñor." 
      },
      { 
        id: 2, 
        title: "Cerca está el Señor", 
        topic: "ENTRADA", 
        lyrics: "ESTRIBILLO:\n[Re]Cerca está el Se[Sim]ñor,\n[Sol]cerca de su [La7]pueblo,\n[Re]cerca de quien lo [La7]invoca de cora[Re]zón." 
      },
      { 
        id: 3, 
        title: "Señor ten piedad (Tradicional)", 
        topic: "SEÑOR, TEN PIEDAD", 
        lyrics: "[Lam]Señor, ten pie[Rem]dad de no[Lam]sotros.\n[Do]Cristo, ten pie[G]dad de no[Lam]sotros.\n[Lam]Señor, ten pie[Rem]dad de no[Lam]sotros." 
      },
      { 
        id: 4, 
        title: "Gloria a Dios en el Cielo", 
        topic: "GLORIA", 
        lyrics: "ESTRIBILLO:\n[Do]Gloria a Dios en el [Fa]cielo\ny en la [Do]tierra paz a los [Sol7]hombres que ama el Se[Do]ñor." 
      },
      { 
        id: 5, 
        title: "Aleluya folclórico", 
        topic: "ALALEUYA", 
        lyrics: "ESTRIBILLO:\n[Sol]Aleluya, ale[Do]luya,\nel Se[Re7]ñor es nuestro [Sol]rey." 
      },
      { 
        id: 6, 
        title: "Entre tus manos", 
        topic: "OFERTORIO", 
        lyrics: "ESTRIBILLO:\n[Re]Entre tus [Mim]manos pongo mi [La7]vida, Señor.\n[Re]Entre tus [Mim]manos pongo mi exis[La7]tir.\n[Re]Hay que mo[Re7]rir para vi[Sol]vir.\n[Re]Entre tus [La7]manos confío mi [Re]ser." 
      },
      { 
        id: 7, 
        title: "Santo es el Señor mi Dios", 
        topic: "SANTO", 
        lyrics: "ESTRIBILLO:\n[Mi]Santo es el Se[Do#m]ñor mi Dios, digno de ala[Si7]banza,\na Él el po[Mi]der, el ho[Do#m]nor y la [Si7]gloria." 
      },
      { 
        id: 8, 
        title: "Cordero de Dios", 
        topic: "CORDERO DE DIOS", 
        lyrics: "[Rem]Cordero de Dios que [Solm]quitas el pe[Do]cado del [Fa]mundo,\n[Rem]ten pie[Solm]dad de no[La7]sotros." 
      },
      { 
        id: 9, 
        title: "Pescador de hombres", 
        topic: "COMUNIÓN", 
        lyrics: "[Do]Tú has ve[Sol]nido a la [Lam]orilla,\n[Fa]no has buscado ni a [Rem]sabios ni a [Sol7]ricos,\n[Do]tan solo [Sol]quieres que [Lam]yo te [Do7]siga.\n\nESTRIBILLO:\n[Fa]Señor, me has mi[Sol]rado a los [Do]ojos,[Lam]\n[Rem]sonriendo has di[Sol7]cho mi [Do]nombre.[Do7]\n[Fa]En la arena he de[Sol]jado mi [Do]barca:[Lam]\n[Rem]junto a Ti busca[Sol7]ré otro [Do]mar." 
      },
      { 
        id: 10, 
        title: "Junto a ti María", 
        topic: "CANTOS A MARÍA", 
        lyrics: "ESTRIBILLO:\n[Re]Junto a ti Ma[La]ría, como un [Sim]niño quiero estar,[Fa#m]\n[Sol]tómame en tus [Re]brazos guíame [Mi7]en mi cami[La7]nar." 
      },
      { 
        id: 11, 
        title: "Altísimo Señor", 
        topic: "ADORACIÓN", 
        lyrics: "[Sol]Altísimo Se[Re]ñor, que su[Do]piste jun[Sol]tar\na un tiempo en el al[Re]tar ser sobe[Do]rano y [Sol]pan." 
      },
      { 
        id: 12, 
        title: "Espíritu Santo Ven", 
        topic: "CONFIRMACIONES", 
        lyrics: "ESTRIBILLO:\n[Rem]Espíritu [Solm]Santo ven, [Rem]ven.\nEspíritu [La7]Santo ven, [Rem]ven.\n[Rem]En el nombre [La7]del Se[Rem]ñor." 
      }
    ];

    const topics = [
      "ENTRADA", "SEÑOR, TEN PIEDAD", "GLORIA", "ALALEUYA", 
      "OFERTORIO", "SANTO", "CORDERO DE DIOS", "COMUNIÓN", 
      "CANTOS A MARÍA", "ADORACIÓN", "CONFIRMACIONES"
    ];

    let navigationHistory = [{ viewId: 'view-home', title: 'CANCIONERO PARROQUIA DE LA ASUNCIÓN LA RAMBLA' }];

    function hideAllViews() {
      document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
    }

    function navigateTo(viewId, title) {
      navigationHistory.push({ viewId: viewId, title: title });
      renderCurrentView();
    }

    function goBack() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        renderCurrentView();
      }
    }

    function renderCurrentView() {
      hideAllViews();
      const currentScreen = navigationHistory[navigationHistory.length - 1];
      
      document.getElementById(currentScreen.viewId).classList.remove('hidden');
      document.getElementById('header-title').innerText = currentScreen.title;

      const backBtn = document.getElementById('btn-back');
      if (navigationHistory.length > 1) {
        backBtn.style.display = 'block';
      } else {
        backBtn.style.display = 'none';
      }
    }

    // NAVEGACIÓN ALFABÉTICA
    function showAlphabet() {
      const container = document.getElementById('view-alphabet');
      container.innerHTML = '';
      const abc = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('');
      
      abc.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'btn-letter';
        btn.innerText = letter;
        btn.onclick = () => showSongsByLetter(letter);
        container.appendChild(btn);
      });

      navigateTo('view-alphabet', 'ÍNDICE ALFABÉTICO');
    }

    function showSongsByLetter(letter) {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';
      
      const filtered = songs
        .filter(s => s.title.toUpperCase().startsWith(letter))
        .sort((a, b) => a.title.localeCompare(b.title));

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding: 20px;">No hay canciones con la letra ${letter}</p>`;
      } else {
        filtered.forEach(song => {
          const div = document.createElement('div');
          div.className = 'item-song';
          div.innerText = song.title;
          div.onclick = () => showLyrics(song);
          container.appendChild(div);
        });
      }

      navigateTo('view-songs-list', `LETRA: ${letter}`);
    }

    // NAVEGACIÓN NUMÉRICA
    function showNumeric() {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';
      
      const sorted = [...songs].sort((a, b) => a.id - b.id);
      
      sorted.forEach(song => {
        const div = document.createElement('div');
        div.className = 'item-song';
        div.innerHTML = `<span class="song-number">${song.id}.</span> ${song.title}`;
        div.onclick = () => showLyrics(song);
        container.appendChild(div);
      });

      navigateTo('view-songs-list', 'ÍNDICE NUMÉRICO');
    }

    // NAVEGACIÓN TEMÁTICA
    function showTopics() {
      const container = document.getElementById('view-topics');
      container.innerHTML = '';

      topics.forEach(topic => {
        const div = document.createElement('div');
        div.className = 'item-topic';
        div.innerText = topic;
        div.onclick = () => showSongsByTopic(topic);
        container.appendChild(div);
      });

      navigateTo('view-topics', 'ÍNDICE TEMÁTICO');
    }

    function showSongsByTopic(topic) {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';

      const filtered = songs.filter(s => s.topic === topic);

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding: 20px;">No hay canciones en este tema</p>`;
      } else {
        filtered.forEach(song => {
          const div = document.createElement('div');
          div.className = 'item-song';
          div.innerText = song.title;
          div.onclick = () => showLyrics(song);
          container.appendChild(div);
        });
      }

      navigateTo('view-songs-list', topic);
    }

    // TRANSFORMAR TEXTO CON CORCHETES [Do] EN ACORDES SUPERIORES
    function parseChords(text) {
      // Reemplaza [Acorde]Texto por <ruby>Texto<rt>Acorde</rt></ruby>
      return text.replace(/\[([^\]]+)\]([^\s\[\n]*)/g, function(match, chord, word) {
        if (!word) {
          // Si el acorde está al final de una línea o frase sin palabra pegada
          return `<ruby>&nbsp;<rt>${chord}</rt></ruby>`;
        }
        return `<ruby>${word}<rt>${chord}</rt></ruby>`;
      });
    }

    // MOSTRAR LETRA Y ACORDES
    function showLyrics(song) {
      document.getElementById('song-title').innerText = `${song.id}. ${song.title}`;
      const container = document.getElementById('song-body');
      container.innerHTML = '';

      // Dividir por bloques de estrofas
      const stanzas = song.lyrics.split(/\r?\n\r?\n/);

      stanzas.forEach(stanza => {
        const div = document.createElement('div');
        const cleanStanza = stanza.trim();
        
        const isRefrain = /ESTRIBILLO|\[Estribillo\]/i.test(cleanStanza) || 
                          (cleanStanza.startsWith('*') && cleanStanza.endsWith('*'));

        if (isRefrain) {
          div.className = 'estribillo';
        } else {
          div.className = 'verse';
        }

        // Quitar indicadores de estribillo visuales y convertir acordes
        let textWithoutHeader = cleanStanza.replace(/^(ESTRIBILLO:|\[Estribillo\]|\*)\s*/i, '').replace(/\*$/, '');
        div.innerHTML = parseChords(textWithoutHeader);

        container.appendChild(div);
      });

      navigateTo('view-lyrics', 'LETRA');
    }
  </script>
</body>
</html>
