<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cancionero Parroquia de la Asunción</title>
  <style>
    :root {
      --bg-color: #1a252f;
      --card-bg: #2c3e50;
      --accent-color: #3498db;
      --text-color: #ffffff;
      --text-secondary: #bdc3c7;
      --refrain-color: #ffffff; /* Color destacado para el estribillo */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 {
      font-size: 1.1rem;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-grow: 1;
    }

    .btn-back {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: none;
      white-space: nowrap;
    }

    main {
      padding: 20px;
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .btn-main {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--accent-color);
      padding: 22px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .grid-abc {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 12px;
    }

    .btn-letter {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      padding: 18px 0;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .list-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-song, .item-topic {
      background-color: var(--card-bg);
      padding: 18px 20px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .song-number {
      font-weight: bold;
      color: var(--accent-color);
      margin-right: 15px;
      font-size: 1.3rem;
    }

    .lyrics-container {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      font-size: 1.35rem;
      line-height: 1.6;
      color: #f1f2f6;
    }

    /* Estrofa normal */
    .verse {
      margin-bottom: 20px;
      font-weight: normal;
      color: #f1f2f6;
      white-space: pre-wrap;
    }

    /* Estribillo completo en NEGRITA */
    .estribillo {
      margin-bottom: 20px;
      font-weight: bold !important;
      color: var(--refrain-color) !important;
      white-space: pre-wrap;
    }

    .lyrics-title {
      font-size: 1.6rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <button id="btn-back" class="btn-back" onclick="goBack()">← Volver</button>
    <h1 id="header-title">CANCIONERO PARROQUIA DE LA ASUNCIÓN LA RAMBLA</h1>
  </header>

  <main>
    <!-- PANTALLA PRINCIPAL (NIVEL 1) -->
    <div id="view-home" class="grid-menu">
      <button class="btn-main" onclick="showAlphabet()">ÍNDICE ALFABÉTICO</button>
      <button class="btn-main" onclick="showNumeric()">ÍNDICE NUMÉRICO</button>
      <button class="btn-main" onclick="showTopics()">ÍNDICE TEMÁTICO</button>
    </div>

    <!-- VISTA ALFABÉTICA (LETRAS) -->
    <div id="view-alphabet" class="grid-abc hidden"></div>

    <!-- VISTA LISTADO TEMÁTICO -->
    <div id="view-topics" class="list-group hidden"></div>

    <!-- VISTA LISTADO DE CANCIONES -->
    <div id="view-songs-list" class="list-group hidden"></div>

    <!-- VISTA LETRA DE CANCIÓN -->
    <div id="view-lyrics" class="hidden">
      <h2 id="song-title" class="lyrics-title"></h2>
      <div id="song-body" class="lyrics-container"></div>
    </div>
  </main>

  <script>
    const songs = [
      { 
        id: 1, 
        title: "Alabaré a mi Señor", 
        topic: "ENTRADA", 
        lyrics: "*\nAlabaré, alabaré,\nalabaré, alabaré,\nalabaré a mi Señor.*\n\nJuan vio el número de los redimidos\ny todos alababan al Señor..." 
      },
      { 
        id: 2, 
        title: "Cerca está el Señor", 
        topic: "ENTRADA", 
        lyrics: "ESTRIBILLO:\nCerca está el Señor,\ncerca de su pueblo,\ncerca de quien lo invoca de corazón." 
      },
      { 
        id: 3, 
        title: "Señor ten piedad (Tradicional)", 
        topic: "SEÑOR, TEN PIEDAD", 
        lyrics: "Señor, ten piedad de nosotros.\nCristo, ten piedad de nosotros.\nSeñor, ten piedad de nosotros." 
      },
      { 
        id: 4, 
        title: "Gloria a Dios en el Cielo", 
        topic: "GLORIA", 
        lyrics: "ESTRIBILLO:\nGloria a Dios en el cielo\ny en la tierra paz a los hombres que ama el Señor." 
      },
      { 
        id: 5, 
        title: "Aleluya folclórico", 
        topic: "ALALEUYA", 
        lyrics: "ESTRIBILLO:\nAleluya, aleluya,\nel Señor es nuestro rey." 
      },
      { 
        id: 6, 
        title: "Entre tus manos", 
        topic: "OFERTORIO", 
        lyrics: "ESTRIBILLO:\nEntre tus manos pongo mi vida, Señor.\nEntre tus manos pongo mi existir.\nHay que morir para vivir.\nEntre tus manos confío mi ser." 
      },
      { 
        id: 7, 
        title: "Santo es el Señor mi Dios", 
        topic: "SANTO", 
        lyrics: "ESTRIBILLO:\nSanto es el Señor mi Dios, digno de alabanza,\na Él el poder, el honor y la gloria." 
      },
      { 
        id: 8, 
        title: "Cordero de Dios", 
        topic: "CORDERO DE DIOS", 
        lyrics: "Cordero de Dios que quitas el pecado del mundo,\nten piedad de nosotros." 
      },
      { 
        id: 9, 
        title: "Pescador de hombres", 
        topic: "COMUNIÓN", 
        lyrics: "Tú has venido a la orilla,\nno has buscado ni a sabios ni a ricos,\ntan solo quieres que yo te siga.\n\nESTRIBILLO:\nSeñor, me has mirado a los ojos,\nsonriendo has dicho mi nombre.\nEn la arena he dejado mi barca:\njunto a Ti buscaré otro mar." 
      },
      { 
        id: 10, 
        title: "Junto a ti María", 
        topic: "CANTOS A MARÍA", 
        lyrics: "ESTRIBILLO:\nJunto a ti María, como un niño quiero estar,\ntómame en tus brazos guíame en mi caminar." 
      },
      { 
        id: 11, 
        title: "Altísimo Señor", 
        topic: "ADORACIÓN", 
        lyrics: "Altísimo Señor, que supiste juntar\na un tiempo en el altar ser soberano y pan." 
      },
      { 
        id: 12, 
        title: "Espíritu Santo Ven", 
        topic: "CONFIRMACIONES", 
        lyrics: "ESTRIBILLO:\nEspíritu Santo ven, ven.\nEspíritu Santo ven, ven.\nEn el nombre del Señor." 
      }
    ];

    const topics = [
      "ENTRADA", "SEÑOR, TEN PIEDAD", "GLORIA", "ALALEUYA", 
      "OFERTORIO", "SANTO", "CORDERO DE DIOS", "COMUNIÓN", 
      "CANTOS A MARÍA", "ADORACIÓN", "CONFIRMACIONES"
    ];

    let navigationHistory = [{ viewId: 'view-home', title: 'CANCIONERO PARROQUIA DE LA ASUNCIÓN LA RAMBLA' }];

    function hideAllViews() {
      document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
    }

    function navigateTo(viewId, title) {
      navigationHistory.push({ viewId: viewId, title: title });
      renderCurrentView();
    }

    function goBack() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        renderCurrentView();
      }
    }

    function renderCurrentView() {
      hideAllViews();
      const currentScreen = navigationHistory[navigationHistory.length - 1];
      
      document.getElementById(currentScreen.viewId).classList.remove('hidden');
      document.getElementById('header-title').innerText = currentScreen.title;

      const backBtn = document.getElementById('btn-back');
      if (navigationHistory.length > 1) {
        backBtn.style.display = 'block';
      } else {
        backBtn.style.display = 'none';
      }
    }

    // NAVEGACIÓN ALFABÉTICA
    function showAlphabet() {
      const container = document.getElementById('view-alphabet');
      container.innerHTML = '';
      const abc = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('');
      
      abc.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'btn-letter';
        btn.innerText = letter;
        btn.onclick = () => showSongsByLetter(letter);
        container.appendChild(btn);
      });

      navigateTo('view-alphabet', 'ÍNDICE ALFABÉTICO');
    }

    function showSongsByLetter(letter) {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';
      
      const filtered = songs
        .filter(s => s.title.toUpperCase().startsWith(letter))
        .sort((a, b) => a.title.localeCompare(b.title));

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding: 20px;">No hay canciones con la letra ${letter}</p>`;
      } else {
        filtered.forEach(song => {
          const div = document.createElement('div');
          div.className = 'item-song';
          div.innerText = song.title;
          div.onclick = () => showLyrics(song);
          container.appendChild(div);
        });
      }

      navigateTo('view-songs-list', `LETRA: ${letter}`);
    }

    // NAVEGACIÓN NUMÉRICA
    function showNumeric() {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';
      
      const sorted = [...songs].sort((a, b) => a.id - b.id);
      
      sorted.forEach(song => {
        const div = document.createElement('div');
        div.className = 'item-song';
        div.innerHTML = `<span class="song-number">${song.id}.</span> ${song.title}`;
        div.onclick = () => showLyrics(song);
        container.appendChild(div);
      });

      navigateTo('view-songs-list', 'ÍNDICE NUMÉRICO');
    }

    // NAVEGACIÓN TEMÁTICA
    function showTopics() {
      const container = document.getElementById('view-topics');
      container.innerHTML = '';

      topics.forEach(topic => {
        const div = document.createElement('div');
        div.className = 'item-topic';
        div.innerText = topic;
        div.onclick = () => showSongsByTopic(topic);
        container.appendChild(div);
      });

      navigateTo('view-topics', 'ÍNDICE TEMÁTICO');
    }

    function showSongsByTopic(topic) {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';

      const filtered = songs.filter(s => s.topic === topic);

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding: 20px;">No hay canciones en este tema</p>`;
      } else {
        filtered.forEach(song => {
          const div = document.createElement('div');
          div.className = 'item-song';
          div.innerText = song.title;
          div.onclick = () => showLyrics(song);
          container.appendChild(div);
        });
      }

      navigateTo('view-songs-list', topic);
    }

    // MOSTRAR LETRA
    function showLyrics(song) {
      document.getElementById('song-title').innerText = `${song.id}. ${song.title}`;
      const container = document.getElementById('song-body');
      container.innerHTML = '';

      // Dividir el texto en párrafos (por saltos de línea dobles)
      const stanzas = song.lyrics.split(/\r?\n\r?\n/);

      stanzas.forEach(stanza => {
        const div = document.createElement('div');
        const cleanStanza = stanza.trim();
        
        // Si contiene ESTRIBILLO, [Estribillo] o empieza y termina con asterisco *...*
        const isRefrain = /ESTRIBILLO|\[Estribillo\]/i.test(cleanStanza) || 
                          (cleanStanza.startsWith('*') && cleanStanza.endsWith('*'));

        if (isRefrain) {
          div.className = 'estribillo';
          // Limpiar asteriscos del principio y final si existen
          div.innerText = cleanStanza.replace(/^\*|\*$/g, '');
        } else {
          div.className = 'verse';
          div.innerText = cleanStanza;
        }

        container.appendChild(div);
      });

      navigateTo('view-lyrics', 'LETRA');
    }
  </script>
</body>
</html>
