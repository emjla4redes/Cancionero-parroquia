<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cancionero Parroquia de la Asunción</title>
  <style>
    :root {
      --bg-color: #1a1512;        /* Fondo oscuro cálido */
      --card-bg: #2c221e;        /* Tarjetas en tono marrón oscuro */
      --accent-color: #e67e22;      /* Naranja cálido */
      --text-color: #ffffff;
      --text-secondary: #bdc3c7;
      --refrain-color: #f1c40f;    /* Amarillo/dorado para el estribillo */
      --chord-color: #5adeff;      /* Azul claro para los acordes */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px solid var(--accent-color);
    }

    h1 {
      font-size: 1.1rem;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-grow: 1;
    }

    .btn-back {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: none;
      white-space: nowrap;
    }

    main {
      padding: 20px;
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    /* MARCO DE LA PORTADA CON SOBREPOSICIÓN */
    .home-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* FILTRO DE OSCURECIMIENTO Y CAPA DE BOTONES */
    .grid-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Coloca los botones en la parte inferior para lucir el arte superior */
      gap: 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0.2) 100%);
    }

    .btn-main {
      background-color: rgba(44, 34, 30, 0.88); /* Fondo semi-transparente que deja ver la portada */
      color: var(--text-color);
      border: 2px solid var(--accent-color);
      padding: 18px 15px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px); /* Efecto cristal traslúcido */
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
      background-color: rgba(230, 126, 34, 0.9);
    }

    .grid-abc {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 12px;
    }

    .btn-letter {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      padding: 18px 0;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .list-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-song, .item-topic {
      background-color: var(--card-bg);
      padding: 18px 20px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .song-number {
      font-weight: bold;
      color: var(--accent-color);
      margin-right: 15px;
      font-size: 1.3rem;
    }

   .lyrics-container {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      font-size: 1.35rem;
      line-height: 2.2;
      color: #f1f2f6;
    }

  /* SISTEMA DE LIBRO AUTO-FLUIDO EN TABLET (LÍNEAS DE DIVISIÓN PROTEGIDAS) */
    @media (min-width: 600px) {
      main {
        max-width: 100%;
        padding: 10px 20px;
      }

      .lyrics-container {
        box-sizing: border-box;
        height: 78vh;
        width: 100%;
        padding: 25px 35px;
        
        /* FLUJO HORIZONTAL TIPO LIBRO */
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        
        column-fill: auto;
        column-gap: 50px; /* Aumenta el espacio seguro entre columna y línea divisoria */
        column-rule: 1px solid rgba(230, 126, 34, 0.35);
      }

     /* TABLET / MONITOR VERTICAL (2 columnas exactas) */
      @media (orientation: portrait) {
        .lyrics-container {
          column-count: 2;
          column-gap: 40px;
        }
      }

      /* TABLET / MONITOR HORIZONTAL 16:9 y 4:3 (3 columnas exactas) */
      @media (orientation: landscape) {
        .lyrics-container {
          column-count: 3;
          column-gap: 40px;
        }
      }

      .verse, .estribillo {
        break-inside: auto; /* Permite cortar la estrofa si se acaba la columna */
        page-break-inside: auto;
        margin-bottom: 22px;
        word-break: break-word; 
        overflow-wrap: break-word;
      }
    }

    .verse {
      margin-bottom: 25px;
      font-weight: normal;
      color: #f1f2f6;
      white-space: pre-wrap;
    }

    .estribillo {
      margin-bottom: 25px;
      font-weight: bold !important;
      color: var(--refrain-color) !important;
      white-space: pre-wrap;
    }

    ruby {
      ruby-position: over;
    }

    rt {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--chord-color);
      line-height: 1;
    }

    .lyrics-title {
      font-size: 1.6rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }
 /* CONTENEDOR DE BOTONES (PESTAÑAS) */
    .toggle-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    /* VISTA DE LA IMAGEN DE PARTITURA */
    .sheet-container {
      width: 100%;
      text-align: center;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
    }

    .sheet-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
/* SELECTOR DE VOCES / INSTRUMENTOS */
    .voice-selector-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .voice-btn {
      padding: 8px 14px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .voice-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
    } 
</style>
</head>
<body>

  <header>

      <h2 id="song-title" class="lyrics-title"></h2>

        <div id="voice-selector" class="voice-selector-container"></div>

        <!-- IMAGEN DE LA PARTITURA SELECCIONADA -->
        <img id="song-sheet-img" src="" alt="Partitura" class="sheet-image">
      </div>
    </div>
  </main>

        lyrics: "*De los cuatro vientos,\nven, sopla tu aliento\nsobre estos muertos, hasta que vivan.*\n\n*De los cuatro vientos, ven,\nsopla tu aliento\nsobre estos muertos,\nhasta que vivan.*\n\nVengo ante Ti\ncon la sencillez de un niño\nque no improvisa,\nno planea, solo confía.\n\nVengo ante Ti,\na vivir de lo que has dicho,\na reclamar\nlo que tú me has prometido.\n\nVen, ven, que Tú eres bienvenido,\nven, ven, a este roto corazón.\nVen, ven, que yo me sienta querido,\nven, ven, quiero bailar contigo.\n\n*De los cuatro vientos,\nven, sopla tu aliento\nsobre estos muertos, hasta que vivan.*\n\n*De los cuatro vientos, ven,\nsopla tu aliento\nsobre estos muertos,\nhasta que vivan. (x2)*\n\nArranca la piedra\nque tengo por corazón\ny dame uno que sangre.\n\nSobre mi alma seca, muerta y oscura\nvuelca tu cascada de agua pura.\n\nVen, ven, y así viviremos,\nven, ven, que no soy nada sin Ti.\nVen, ven, te reconoceremos,\nven, ven, quiero bailar contigo.\n\n*De los cuatro vientos,\nven, sopla tu aliento\nsobre estos muertos, hasta que vivan.*\n\n*De los cuatro vientos, ven,\nsopla tu aliento\nsobre estos muertos,\nhasta que vivan.*\n\nSé que estás aquí,\nque me oyes y que me ves,\nporque Tú eres fiel.\nGracias por venir a este lugar,\ngracias por moverte en mí.\nPorque para recibir\nsólo tengo que pedir."

        title: "Un Dios débil (Hakuna)",

        lyrics: "Esto sí que lo entiendo,\n¡y cómo me gusta!\nver un Dios débil,\nniño desnudo en tus brazos.\nY rehén aplastado\npor la cruz y en agonía,\npero siempre necesitado de Ti, María.\n\nCómo cambia el espíritu de un niño\nuna noche de miedo,\ncuando se arropa, bajo las sábanas\nde su madre.\n\nEstás ahí, te necesito,\nno te vayas, no te vayas.\n\n*Tu calor, tacto, vista...tu cercanía\nno cambia nada, y lo cambias todo.\nTu calor, tacto, vista...tu cercanía\nNo cambia nada, lo cambias todo,\nlo cambias todo.*\n\nEsto sí que lo entiendo,\n¡y cómo me gusta!\nver un Dios débil, naturalmente débil,\nun Dios necesitado de compañía,\nde una Madre, de mirada y cercanía.\n\nCómo cambia el dolor de un enfermo\ncuando entrelaza sus dedos\ncon los de otra mano conocida.\n\nEstás ahí, te necesito,\nno te vayas, no te vayas.\n\n*Tu calor, tacto, vista...tu cercanía\nno cambia nada, y lo cambias todo.\nTu calor, tacto, vista...tu cercanía\nNo cambia nada, lo cambias todo,\nlo cambias todo.*\n\nEn un momento difícil\ntodos piden, llaman, gritan,\nqueremos recibir tu consuelo,\nsabernos acompañados\npor una madre inseparable.\nOjalá tus hijos te sientan a su lado.\n\n*Tu calor, tacto, vista...tu cercanía\nno cambia nada, y lo cambias todo.\nTu calor, tacto, vista...tu cercanía\nNo cambia nada, lo cambias todo,\nlo cambias todo.*"

        lyrics: "Que ni una ni mil piedras\nen el camino te hagan tropezar,\nno te ates a nada no hay tiempo\npara dejar la oportunidad pasar.\nQue no hay excusa alguna\npara no servir a los demás,\nsiempre sonriente sin dejar\na la queja entrar.\n\nQue un ángel nos ha enseñado\ncómo se debe volar,\nque si llevas la cruz a cuestas\nno se tiene por qué notar,\nque si esta no es nuestra liga, entonces\n¿a qué te quieres aferrar?\n\n*Simplemente baila\ny déjate de historias,\naunque no tengas el control,\ncualquiera que sea la canción,\ndéjate llevar en el salón,\ndéjate hacer, que trace tu camino,\nÉl también quiere bailar contigo.*\n\nQue si el sufrimiento es por amor,\nel dolor es diferente,\nentrégate hasta el extremo,\nempápate de esta fuente\ninagotable, infinita,\nde la que siempre se sacan fuerzas,\nes Dios Padre quien te grita,\nque te acompaña en lo que elijas.\nCada segundo puede ser el último,\nes la hora de levantarse,\nVive derramando,\nderramando todo el vaso,\nque no haya gota que se salve.\nBusca creatividad,\nlo terrenal puede esperar,\nrecuerda que no poner firma\nes la mejor forma de firmar.\n\n*Simplemente baila\ny déjate de historias,\naunque no tengas el control,\ncualquiera que sea la canción,\ndéjate llevar en el salón,\ndéjate hacer, que trace tu camino,\nÉl también quiere bailar contigo.*\n\nRecuerda que somos eternos,\nrecuerda que el tiempo no es nuestro,\nrecuerda que el Cielo está abierto,\nde ti depende que entren cientos.\n\n*Simplemente baila\ny déjate de historias,\naunque no tengas el control,\ncualquiera que sea la canción,\ndéjate llevar en el salón,\ndéjate hacer, que trace tu camino.*\n\n*Simplemente baila\ny déjate de historias,\naunque no tengas el control,\ncualquiera que sea la canción,\ndéjate llevar en el salón,\ndéjate hacer, que trace tu camino,\nÉl también quiere bailar contigo.*"

      {

        title: "Conciénciame (Hakuna)",

        lyrics: "Vengo a gritarte los deseos\nde mi corazón,\nporque a sus últimos despliegues\nsólo tus manos llegan, sólo.\n\n*Conciénciame, Señor.\nConciénciame, Señor.*\n\nMe siento amado por mí mismo\ny no por mis actos,\nde ser no sólo deseado\nsiendo imprescindible para ti.\n\nUh, uh, uh, uh. (x3)\n\nDe ser persona de tu confianza,\na pesar de mi pasado,\nmendigo de tu vida,\nde tu humanidad he necesitado.\nEn ese templo en que estás vivo\ncon infinita fuerza,\es el motivo de que Dios\nse recree en mi belleza.\n\n*Conciénciame, Señor,\nconciénciame\nde ser el único que puede\nsaciar tu sed de mí.*\n\nDe no estar hecho para el éxito,\nsi no para el amor,\nde no vivir para mí mismo,\nsi no para la comunión.\n\nUh, uh, uh, uh. (x3)\n\nDe no vivir de sentimientos,\nsi no sensibilidad,\nno querer cumplir mis metas,\nsi no amar tu voluntad,\nse ser un no de los llamados\na tu revolución,\nde ser carne de Cristo,\ncuerpo de mi Señor.\n\n*Conciénciame, Señor,\nconciénciame, Señor,\nconciénciame, Señor,\nconciénciame de ser el único \nque puede saciar tu sed de mí.*"

      {

        title: "Dime, Padre (Hakuna)", 
        topic: ["COMUNIÓN"], 
        lyrics: "*Dime, Padre*\n\nqué podemos hacer,\ntus hijos se pierden\ny no entiendo por qué.\n\n*Dime, Padre,*\n\ncada día se alejan más\ny de verdad que\nno he hecho nada mal,\npero curan sus heridas\ncon lo que no les curará.\n\nLes di el Mandamiento del Amor,\nme crucificarían mil veces más,\npero ellos huyen de su Creador\ny de su eterna felicidad.\n\nY es que los hemos hecho tan libres,\nque a veces me duele pensar\nque este don y este regalo\nlo utilicen para el mal.\n\n*Dime, Padre,*\ncómo a nuestra familia reunir,\nles ofrecemos la Eternidad,\npero prefieren huir.\n\n*Dime, Padre,*\n\ncómo ablandar su corazón,\ncómo quitar esta coraza\nformada por el dolor.\n\nSi supieran cuánto les amamos,\nsi supieran que todo tiene un porqué.\nDime, Padre,\ncómo a sus almas acoger.\nSi supieran que ahora somos dependientes\nde que nuestra creación nos quiera,\nnuestro único deseo\nes que sus almas estén llenas.\n\n*Dime, Padre,*\n\ncómo les explicamos\nque son\nlo que más amamos.\n\n*Dime, Padre,*\n\ncómo les guiamos\na aquello que les completa,\nsi es que se refugian en falsas metas.\nY nos destroza verles odiarse,\nverles odiarse con tanta fuerza.\n\n*Dime, Padre,*\ncómo parar este dolor,\nquiero que me quieran,\npero no es obligación.\nLes miro con mis ojos,\nllenos de compasión\ny te aseguro que acepto\ncualquier tipo de perdón.\n\nSolo nos queda esperar\na que escuchen nuestra voz,\nque vean las puertas abiertas\nde este cielo acogedor,\nque siempre serán bienvenidos\na los brazos de este Corazón,\nque solo quiere verlos unidos\nen la tierra con su Salvador.\n\nY me hago pan, pero no me ven.\nMe cuelo en sus pensamientos,\npero no me ven.\nMe meto en sus entrañas\nuna y otra vez.\nLloro todos los días,\npero no me ven.\n\n*Dime, Padre,*\n\nqué puedo hacer.\nTus hijos se pierden y se alejan\ny me da miedo que no sepan volver.\n\nPapá, dejarán de llorar,\nespero que estos caminos vacíos\nse puedan solucionar.\nEsperaré hasta el último segundo\npara volverlo a int     const topics = [
      "ENTRADA", "SEÑOR, TEN PIEDAD", "GLORIA", "ALELUYA", 
      "OFERTORIO", "SANTO", "CORDERO DE DIOS", "COMUNIÓN", 
      "CANTOS A MARÍA", "ADORACIÓN", "CONFIRMACIONES"
    ];

    let navigationHistory = [{ viewId: 'view-home', title: 'CANCIONERO PARROQUIA DE LA ASUNCIÓN LA RAMBLA' }];

    function hideAllViews() {
      document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
    }

    function navigateTo(viewId, title) {
      navigationHistory.push({ viewId: viewId, title: title });
      renderCurrentView();
    }

    function goBack() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        renderCurrentView();
      }
    }

    function renderCurrentView() {
      hideAllViews();
      const currentScreen = navigationHistory[navigationHistory.length - 1];
      
      document.getElementById(currentScreen.viewId).classList.remove('hidden');
      document.getElementById('header-title').innerText = currentScreen.title;

      const backBtn = document.getElementById('btn-back');
      if (navigationHistory.length > 1) {
        backBtn.style.display = 'block';
      } else {
        backBtn.style.display = 'none';
      }
    }

    function showAlphabet() {
      const container = document.getElementById('view-alphabet');
      container.innerHTML = '';
      const abc = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('');
      
      abc.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'btn-letter';
        btn.innerText = letter;
        btn.onclick = () => showSongsByLetter(letter);
        container.appendChild(btn);
      });

      navigateTo('view-alphabet', 'ÍNDICE ALFABÉTICO');
    }

    function showSongsByLetter(letter) {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';
      
      const filtered = songs
        .filter(s => s.title.toUpperCase().startsWith(letter))
        .sort((a, b) => a.title.localeCompare(b.title));

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding: 20px;">No hay canciones con la letra ${letter}</p>`;
      } else {
        filtered.forEach(song => {
          const div = document.createElement('div');
          div.className = 'item-song';
          div.innerText = song.title;
          div.onclick = () => showLyrics(song);
          container.appendChild(div);
        });
      }

      navigateTo('view-songs-list', `LETRA: ${letter}`);
    }

    function showNumeric() {
      const container = document.getElementById('view-songs-list');
      container.innerHTML = '';
      
      const sorted = [...songs].sort((a, b) => a.id - b.id);
      
      sorted.forEach(song => {
        const div = document.createElement('div');
        div.className = 'item-song';
        div.innerHTML = `<span class="song-number">${song.id}.</span> ${song.title}`;
        div.onclick = () => showLyrics(song);
        container.appendChild(div);
      });

      navigateTo('view-songs-list', 'ÍNDICE NUMÉRICO');
    }

    function showTopics() {
      const container = document.getElementById('view-topics');
      container.innerHTML = '';

      topics.forEach(topic => {
        const div = document.createElement('div');
        div.className = 'item-topic';
        div.innerText = topic;
        div.onclick = () => showSongsByTopic(topic);
        container.appendChild(div);
      });

      navigateTo('view-topics', 'ÍNDICE TEMÁTICO');
    }

    function showSongsByTopic(topic) {
  const container = document.getElementById('view-songs-list');
  container.innerHTML = '';

  // Filtra si el topic buscado está dentro del array o coincide con el texto
  const filtered = songs.filter(s => 
    Array.isArray(s.topic) ? s.topic.includes(topic) : s.topic === topic
  );

  if (filtered.length === 0) {
    container.innerHTML = `<p style="text-align:center; padding: 20px;">No hay canciones en este tema</p>`;
  } else {
    filtered.forEach(song => {
      const div = document.createElement('div');
      div.className = 'item-song';
      div.innerText = song.title;
      div.onclick = () => showLyrics(song);
      container.appendChild(div);
    });
  }

  navigateTo('view-songs-list', topic);
}

    function parseChords(text) {
      return text.replace(/\[([^\]]+)\]([^\s\[\n]*)/g, function(match, chord, word) {
        if (!word) {
          return `<ruby>&nbsp;<rt>${chord}</rt></ruby>`;
        }
        return `<ruby>${word}<rt>${chord}</rt></ruby>`;
      });
    }

   let currentSongData = null;

    function showLyrics(song) {
      currentSongData = song;
      document.getElementById('song-title').innerText = `${song.id}. ${song.title}`;
      
      const container = document.getElementById('song-body');
      container.innerHTML = '';

      const stanzas = song.lyrics.split(/\r?\n\r?\n/);

      stanzas.forEach(stanza => {
        const div = document.createElement('div');
        const cleanStanza = stanza.trim();
        const isRefrain = /ESTRIBILLO|\[Estribillo\]/i.test(cleanStanza) || 
                          (cleanStanza.startsWith('*') && cleanStanza.endsWith('*'));

        div.className = isRefrain ? 'estribillo' : 'verse';
        let textWithoutHeader = cleanStanza.replace(/^(ESTRIBILLO:|\[Estribillo\]|\*)\s*/i, '').replace(/\*$/, '');
        div.innerHTML = parseChords(textWithoutHeader);
        container.appendChild(div);
      });

      // Asegura que la canción empiece siempre en la primera página
      container.scrollLeft = 0;
      container.scrollTop = 0;

      // Configuración de partituras (si existen)
      const btnSheet = document.getElementById('btn-tab-sheet');
      const voiceSelector = document.getElementById('voice-selector');
      voiceSelector.innerHTML = '';

      if (song.sheet && (Array.isArray(song.sheet) ? song.sheet.length > 0 : true)) {
        btnSheet.style.display = 'block';

        const sheetsArray = Array.isArray(song.sheet) 
          ? song.sheet 
          : [{ name: "Partitura", url: song.sheet }];

        sheetsArray.forEach((sheetItem, index) => {
          const btn = document.createElement('button');
          btn.className = `voice-btn ${index === 0 ? 'active' : ''}`;
          btn.innerText = sheetItem.name || `Voz ${index + 1}`;
          btn.onclick = () => selectVoiceSheet(sheetItem.url, btn);
          voiceSelector.appendChild(btn);
        });

        document.getElementById('song-sheet-img').src = sheetsArray[0].url;
        voiceSelector.style.display = sheetsArray.length > 1 ? 'flex' : 'none';

      } else {
        document.getElementById('song-sheet-img').src = '';
        btnSheet.style.display = 'none';
      }

      switchSongView('lyrics');
      navigateTo('view-lyrics', song.title);
    }

    function selectVoiceSheet(url, clickedBtn) {
      document.getElementById('song-sheet-img').src = url;
      
      // Actualizar botón activo en el selector de voces
      const buttons = document.querySelectorAll('.voice-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      clickedBtn.classList.add('active');
    }

    function switchSongView(viewType) {
      const lyricsDiv = document.getElementById('song-body');
      const sheetDiv = document.getElementById('song-sheet-container');
      const btnLyrics = document.getElementById('btn-tab-lyrics');
      const btnSheet = document.getElementById('btn-tab-sheet');

      if (viewType === 'lyrics') {
        lyricsDiv.classList.remove('hidden');
        sheetDiv.classList.add('hidden');
        btnLyrics.classList.add('active');
        btnSheet.classList.remove('active');
      } else {
        lyricsDiv.classList.add('hidden');
        sheetDiv.classList.remove('hidden');
        btnLyrics.classList.remove('active');
        btnSheet.classList.add('active');
      }
    }
